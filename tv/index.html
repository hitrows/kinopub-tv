<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>KinoPub</title>
<link rel="stylesheet" type="text/css" href="css/app.css" />
<script type="text/javascript" src="$MANAGER_WIDGET/Common/API/Widget.js"></script>
<script type="text/javascript" src="$MANAGER_WIDGET/Common/API/TVKeyValue.js"></script>
<script type="text/javascript" src="$MANAGER_WIDGET/Common/API/Plugin.js"></script>
<script type="text/javascript">
/* Boot loader. The cloud build asks the Worker for the latest app code and
   runs it if it's newer than the copy installed on the TV; without network
   (or in the local build) the installed copy runs. */
var Boot = {
	proxy: '__PROXY__', cloud: '__CLOUD__' === '1', version: '__VERSION__', build: parseInt('__BUILD__', 10) || 0, started: false,

	// two-part number as the first shells compared versions: 1.9 -> 1009
	num: function (v) { var p = String(v).split('.'); return (parseInt(p[0], 10) || 0) * 1000 + (parseInt(p[1], 10) || 0); },

	script: function (src, cb) {
		var s = document.createElement('script');
		s.type = 'text/javascript';
		s.onload = function () { cb(true); };
		s.onerror = function () { cb(false); };
		s.src = src;
		document.getElementsByTagName('head')[0].appendChild(s);
	},

	run: function () {
		if (Boot.started || !window.App) return false;
		Boot.started = true;
		App.init();
		return true;
	},

	local: function () { Boot.script('js/app.js', function () { Boot.run(); }); },

	go: function () {
		if (!Boot.cloud || Boot.proxy.charAt(0) === '_') return Boot.local();
		var x = new XMLHttpRequest(), done = false;
		var give = function () { if (!done) { done = true; Boot.local(); } };
		var timer = setTimeout(function () { try { x.abort(); } catch (e) {} give(); }, 3000);
		x.onreadystatechange = function () {
			if (x.readyState !== 4 || done) return;
			clearTimeout(timer);
			var m = null;
			try { m = JSON.parse(x.responseText); } catch (e) {}
			if (x.status !== 200 || !m || (m.build || Boot.num(m.version)) <= (Boot.build || Boot.num(Boot.version))) return give();
			done = true;
			Boot.script(Boot.proxy + '/app/' + m.js, function (ok) {
				if (!ok || !window.App) { done = false; return give(); }
				var l = document.createElement('link');
				l.rel = 'stylesheet'; l.type = 'text/css'; l.href = Boot.proxy + '/app/' + m.css;
				document.getElementsByTagName('head')[0].appendChild(l);
				Boot.run();
			});
		};
		x.open('GET', Boot.proxy + '/app/manifest.json', true);
		x.send(null);
	}
};
</script>
</head>
<body onload="Boot.go();">
<object id="pluginObjectNNavi" border="0" classid="clsid:SAMSUNG-INFOLINK-NNAVI" style="position:absolute;width:0;height:0;"></object>
<object id="pluginObjectTVMW" border="0" classid="clsid:SAMSUNG-INFOLINK-TVMW" style="position:absolute;width:0;height:0;"></object>

<object id="pluginPlayer" border="0" classid="clsid:SAMSUNG-INFOLINK-PLAYER" style="position:absolute;left:0;top:0;width:960px;height:540px;"></object>

<a href="javascript:void(0);" id="anchor" onkeydown="if (window.App) App.onKey(event);"></a>

<div id="root"></div>
</body>
